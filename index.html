<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meyer Setup Map</title>
  <style>
    body {
      background: #1e1e1e;
      color: #ecf0f1;
      font-family: "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h2 {
      margin-bottom: 10px;
      color: #00d9ff;
      text-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
    }

    p {
      margin-bottom: 20px;
      color: #bdc3c7;
    }

    .map-container {
      max-width: 900px;
      margin: auto;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    area {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Explore My PC Setup</h2>
  <p>Click on the parts of the setup to zoom in.</p>

  <div class="map-container">
    <!-- Main Setup Image -->
    <img src="https://i.imgur.com/ZJK8hOf.jpeg" usemap="#pc-map">
  </div>


  
  <!-- Clickable Map -->
  <map name="pc-map">
    <area target="_blank" alt="Keyboard & Mouse" title="Keyboard & Mouse" 
          href="https://drive.google.com/u/0/drive-viewer/AKGpihb0MJoNKGfmj75Xa4Mb5JW-pZ8e6u-1EbH9XhqfaeQai1jaSoOwpcXCC-h8IQBCovvMs5dvqdtTzvmkddyN11EPiTgIRWDSV4k=s1600-rw-v1" 
          coords="383,283,235,325,299,425,674,425,470,325" shape="poly">

    <area target="_blank" alt="PC Case" title="PC Case" 
          href="https://drive.google.com/u/0/drive-viewer/AKGpihZIz8DGioYG0O1YrSDtxdSxfLHD5IYQaK-a32ocksQ5KoIOGV0TW_YGJ14DQdi2cVp4KiyVqOkwbVBliwTJwme059eRaw_Heg=s1600-rw-v1" 
          coords="396,276,386,205,376,120,278,127,190,103,101,109,138,281,228,325,276,306,303,302" shape="poly">

    <area target="_blank" alt="Top of Case" title="Top of Case" 
          href="https://drive.google.com/u/0/drive-viewer/AKGpihbZGGMbL2c6CDPTzbnIVbeViDh3fWJaJT6RDWFdMZvhf5jdmrPxzX8DuNAGY9be5YFgf01fm0Tf_OIYpFUI2yMdRLuVOxuwFNU=s1600-rw-v1" 
          coords="186,99,277,123,378,115,368,3,149,-1,86,2,105,104,139,104" shape="poly">

    <area target="_blank" alt="Game Screen" title="Game Screen" 
          href="https://drive.google.com/u/0/drive-viewer/AKGpihY2G4RkL9tCIy0Esxh17FuEIA03gGlkCQQ4T9F7twqDSRtgjysWvk0CN7EM1oEe7rf5hM3CHp92a02uxm4Yq61UTgwNdE6ZhQ=s1600-rw-v1" 
          coords="369,5,756,0,755,424,679,426,401,283" shape="poly">
  </map>

</body>
</html>
